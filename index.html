<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#142B4A">
<title>SMJ Inventory</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2048%2048%22%3E%3Crect%20width%3D%2248%22%20height%3D%2248%22%20rx%3D%2213%22%20fill%3D%22%23142B4A%22%2F%3E%3Cpath%20d%3D%22M24%2011L37%2018.5L24%2026L11%2018.5Z%22%20fill%3D%22%232563EB%22%2F%3E%3Cpath%20d%3D%22M11%2018.5L24%2026V41L11%2033.5Z%22%20fill%3D%22%23FFFFFF%22%2F%3E%3Cpath%20d%3D%22M37%2018.5L24%2026V41L37%2033.5Z%22%20fill%3D%22%23BFDBFE%22%2F%3E%3C%2Fsvg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#142B4A;--blue:#2563EB;--blue-l:#EFF6FF;--bg:#F5F7FB;--card:#FFFFFF;--ink:#172033;--mut:#64748B;--line:#E5EAF1;
  --ok:#159B68;--ok-l:#E8F7F0;--bad:#DC3545;--bad-l:#FDECEE;--warn:#D97706;--warn-l:#FEF5E7;
  --r-sm:10px;--r:14px;--r-lg:20px;
  --sh:0 1px 2px rgba(20,43,74,.04),0 4px 14px rgba(20,43,74,.05);
  --sh-h:0 2px 4px rgba(20,43,74,.05),0 10px 28px rgba(20,43,74,.09);
  --side:248px;--side-c:80px;--top:64px;--bnav:68px;
  --font:'Inter','Hind Siliguri',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:8px}
[hidden]{display:none !important}
svg.i{width:20px;height:20px;flex:none}
.num{font-variant-numeric:tabular-nums}

/* ---------- Shell ---------- */
.side{position:fixed;left:0;top:0;bottom:0;width:var(--side);background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 14px;z-index:6;transition:width .25s ease}
.sbrand{display:flex;align-items:center;gap:12px;padding:4px 8px 22px;min-width:0}
.logo{width:40px;height:40px;flex:none;border-radius:12px;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px;letter-spacing:.6px}
.sb-txt{min-width:0;white-space:nowrap}
.sb-txt b{display:block;font-size:15px;font-weight:700;letter-spacing:-.01em}
.sb-txt small{color:var(--mut);font-size:12px}
.nav{display:flex;flex-direction:column;gap:4px;flex:1}
.nav button{display:flex;align-items:center;gap:12px;padding:10px 12px;border:none;background:transparent;border-radius:var(--r-sm);color:var(--mut);font-weight:600;font-size:14px;text-align:left;transition:background .15s,color .15s;white-space:nowrap;position:relative}
.nav button:hover{background:#F1F5FA;color:var(--ink)}
.nav button.on{background:var(--blue-l);color:var(--blue)}
.nav button.on::before{content:'';position:absolute;left:-14px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--blue)}
.collapse{margin-top:auto;display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:#fff;border-radius:var(--r-sm);padding:9px 12px;color:var(--mut);font-weight:600;font-size:13px}
.collapse svg{transition:transform .25s}
body.side-c .side{width:var(--side-c)}
body.side-c .sb-txt,body.side-c .nav span,body.side-c .collapse span{display:none}
body.side-c .collapse svg{transform:rotate(180deg)}
body.side-c .sbrand{justify-content:center;padding-left:0;padding-right:0}
body.side-c .nav button{justify-content:center;padding:11px 0}
body.side-c .nav button.on::before{left:-14px}

.main{margin-left:var(--side);min-height:100vh;display:flex;flex-direction:column;transition:margin-left .25s ease}
body.side-c .main{margin-left:var(--side-c)}
.top{position:sticky;top:0;z-index:5;height:var(--top);background:rgba(255,255,255,.9);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 28px}
.top-l{display:flex;align-items:center;gap:12px;min-width:0}
.mlogo{display:none;width:34px;height:34px;border-radius:10px;background:var(--navy);color:#fff;place-items:center;font-weight:800;font-size:11px;flex:none}
.top h2{margin:0;font-size:17px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-r{display:flex;align-items:center;gap:8px;flex:none}
.ibtn{width:38px;height:38px;border-radius:var(--r-sm);border:1px solid var(--line);background:#fff;display:grid;place-items:center;color:var(--mut);transition:all .15s}
.ibtn:hover{color:var(--ink);border-color:#D3DBE7;box-shadow:var(--sh)}
.ibtn:active{transform:scale(.95)}
.ibtn.spin svg{animation:spin 1s linear infinite}
.lang{height:38px;padding:0 12px;border-radius:var(--r-sm);border:1px solid var(--line);background:#fff;font-weight:600;font-size:13px;color:var(--ink)}
.netpill{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--mut);padding:6px 10px;border-radius:999px;background:#F5F7FB;border:1px solid var(--line);white-space:nowrap}
.netpill i{width:8px;height:8px;border-radius:50%;background:var(--ok);display:block}
.netpill.off i{background:var(--mut)}
.netpill.warn i{background:var(--warn)}
.netpill.bad i{background:var(--bad)}
.role{font-size:12px;font-weight:700;color:var(--blue);background:var(--blue-l);padding:5px 10px;border-radius:999px;white-space:nowrap}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}

.page{padding:26px 28px 40px;max-width:1320px;width:100%}
.sec{display:none}
.sec.on{display:block;animation:fadeUp .35s ease both}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.ph h1{margin:0;font-size:24px;font-weight:800;letter-spacing:-.02em}
.ph p{margin:4px 0 0;color:var(--mut);font-size:13px}

/* ---------- Common ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:var(--r-sm);padding:10px 16px;font-weight:600;font-size:14px;transition:transform .15s,box-shadow .2s,background .2s,opacity .2s;background:var(--blue);color:#fff;box-shadow:0 4px 12px rgba(37,99,235,.22);white-space:nowrap}
.btn:hover:not(:disabled){box-shadow:0 6px 16px rgba(37,99,235,.3);transform:translateY(-1px)}
.btn:active:not(:disabled){transform:translateY(0) scale(.98)}
.btn:disabled{opacity:.55;cursor:not-allowed;box-shadow:none}
.btn.sec2{background:#fff;color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn.sec2:hover:not(:disabled){border-color:#CBD5E1;box-shadow:var(--sh)}
.btn.ok{background:var(--ok);box-shadow:0 4px 12px rgba(21,155,104,.22)}
.btn.bad{background:var(--bad-l);color:var(--bad);box-shadow:none}
.btn.sm{padding:7px 12px;font-size:13px}
.btn.block{width:100%}
.inp{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:var(--r-sm);background:#fff;font-size:14px;outline:none;transition:border-color .15s,box-shadow .15s}
.inp:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.14)}
.fl{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.fl>span{font-size:12px;font-weight:600;color:var(--mut)}
.hint{font-size:12.5px;color:var(--mut);margin:8px 0;line-height:1.55}
.badge{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.badge i{width:6px;height:6px;border-radius:50%;background:currentColor;display:block}
.b-ok{background:var(--ok-l);color:var(--ok)}
.b-low{background:var(--warn-l);color:var(--warn)}
.b-bad{background:var(--bad-l);color:var(--bad)}
.b-mut{background:#F1F5F9;color:var(--mut)}
.b-blue{background:var(--blue-l);color:var(--blue)}
.skel{background:linear-gradient(90deg,#EEF2F7 25%,#F8FAFD 37%,#EEF2F7 63%);background-size:400% 100%;animation:shim 1.4s ease infinite;border-radius:var(--r-sm)}
.empty{text-align:center;padding:56px 20px;color:var(--mut)}
.empty .ei{width:64px;height:64px;margin:0 auto 14px;border-radius:20px;background:var(--blue-l);color:var(--blue);display:grid;place-items:center}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}

/* ---------- Dashboard ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:18px}
.kpi{padding:18px;position:relative;overflow:hidden}
.kpi .kh{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.kpi .kico{width:38px;height:38px;border-radius:12px;display:grid;place-items:center}
.kpi .kv{font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.kpi .kl{font-size:13px;color:var(--mut);font-weight:500;margin-top:6px}
.kpi .ks{font-size:12px;color:var(--mut);margin-top:8px}
.k-blue .kico{background:var(--blue-l);color:var(--blue)}
.k-navy .kico{background:#EAEEF5;color:var(--navy)}
.k-ok .kico{background:var(--ok-l);color:var(--ok)}
.k-warn .kico{background:var(--warn-l);color:var(--warn)}
.k-bad .kico{background:var(--bad-l);color:var(--bad)}
.dgrid{display:grid;grid-template-columns:1.4fr 1fr;gap:18px}
.panel-c{padding:20px}
.panel-c h3{margin:0 0 4px;font-size:15px;font-weight:700}
.panel-c .sub{color:var(--mut);font-size:12.5px;margin-bottom:16px}
.bars{display:flex;flex-direction:column;gap:14px}
.bar-row{display:grid;grid-template-columns:110px 1fr 70px;align-items:center;gap:12px;font-size:13px}
.bar-row .bn{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-row .bt{height:9px;background:#EEF2F7;border-radius:99px;overflow:hidden}
.bar-row .bt i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),#60A5FA);border-radius:99px;transition:width .6s ease}
.bar-row .bv{text-align:right;color:var(--mut);font-weight:600}
.low-list{display:flex;flex-direction:column}
.low-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-top:1px solid var(--line)}
.low-item:first-child{border-top:none;padding-top:2px}
.low-item .ln{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.low-item .lc{font-size:12px;color:var(--mut)}
.dnote{margin-top:14px;font-size:12px;color:var(--mut);background:#F8FAFC;border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px}

/* ---------- Inventory ---------- */
.kpi.clickable{cursor:pointer;transition:transform .15s,box-shadow .2s}
.kpi.clickable:hover{transform:translateY(-2px);box-shadow:var(--sh-h)}
.kpi .go{display:inline-block;margin-top:8px;font-size:12px;font-weight:700;color:var(--blue)}

.toolbar{display:flex;gap:12px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.search{position:relative;flex:1;min-width:220px}
.search input{padding-left:42px;height:44px;border-radius:var(--r);box-shadow:var(--sh)}
.search .si{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#94A3B8}
.search .clr{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:none;background:#EEF2F7;width:28px;height:28px;border-radius:8px;color:var(--mut);display:none}
.search.has .clr{display:grid;place-items:center}
.vt{display:none;gap:4px;padding:4px;background:#fff;border:1px solid var(--line);border-radius:var(--r-sm)}
.vt button{border:none;background:transparent;border-radius:7px;padding:6px 10px;color:var(--mut);display:flex;align-items:center;gap:6px;font-weight:600;font-size:13px}
.vt button.on{background:var(--navy);color:#fff}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;margin:0 -2px 6px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.pill{flex:none;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-weight:600;font-size:13px;color:var(--mut);transition:all .15s}
.pill em{font-style:normal;font-size:12px;background:#F1F5F9;color:var(--mut);border-radius:999px;padding:1px 8px;font-weight:700}
.pill:hover{color:var(--ink);border-color:#CBD5E1}
.pill.on{background:var(--navy);border-color:var(--navy);color:#fff}
.pill.on em{background:rgba(255,255,255,.2);color:#fff}
.resline{display:flex;justify-content:space-between;align-items:center;color:var(--mut);font-size:13px;margin:6px 2px 14px;gap:10px}
.resline button{border:none;background:none;color:var(--blue);font-weight:600;font-size:13px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.pc{padding:18px;display:flex;flex-direction:column;transition:box-shadow .2s,transform .2s,border-color .2s;animation:fadeUp .4s ease both;position:relative}
.pc:hover{box-shadow:var(--sh-h);transform:translateY(-2px);border-color:#D9E1EC}
.pc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.pc-name{margin:0;font-size:16px;font-weight:700;line-height:1.3;letter-spacing:-.01em;word-break:break-word}
.pc-meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:7px}
.code{font:600 11.5px/1 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--mut);background:#F1F5F9;border-radius:6px;padding:4px 7px;letter-spacing:.2px}
.catp{font-size:12px;font-weight:600;color:var(--blue);background:var(--blue-l);border-radius:6px;padding:4px 8px}
.rates2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.rp{border:1px solid var(--line);border-radius:var(--r-sm);padding:11px 12px;background:#FAFBFD;min-width:0}
.rp.sale{background:var(--blue-l);border-color:#D6E4FF}
.rp small{display:block;font-size:11px;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:.5px}
.rp b{display:block;font-size:19px;font-weight:700;margin-top:3px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rp.sale b{color:var(--blue)}
.rp.miss b{color:var(--mut);font-weight:600;font-size:14px}
.profit{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px;border-radius:var(--r-sm);padding:10px 12px}
.profit.pos{background:var(--ok-l);color:var(--ok)}
.profit.neg{background:var(--bad-l);color:var(--bad)}
.profit .pl{font-size:12px;font-weight:600;opacity:.85}
.profit .pv{font-size:17px;font-weight:800;letter-spacing:-.01em}
.profit .pp{font-size:13px;font-weight:700;background:rgba(255,255,255,.7);border-radius:999px;padding:2px 9px}
.stk{margin-top:14px}
.stk-r{display:flex;justify-content:space-between;align-items:center;gap:8px}
.stk-r .sv{font-weight:700;font-size:14px}
.stk-r .sv small{color:var(--mut);font-weight:500}
.stk-bar{height:6px;background:#EEF2F7;border-radius:99px;overflow:hidden;margin-top:9px}
.stk-bar i{display:block;height:100%;border-radius:99px;background:var(--lv,#94A3B8);transition:width .6s ease}
.pc-foot{display:flex;gap:8px;margin-top:auto;padding-top:16px}
.pc-foot .btn{flex:1}
.remark{margin-top:12px;font-size:12.5px;font-weight:600;border-radius:var(--r-sm);padding:8px 11px;display:flex;align-items:center;gap:7px}
.remark.out{background:var(--bad-l);color:var(--bad)}
.remark.ok{background:var(--ok-l);color:var(--ok)}
.syncchip{font-size:11.5px;font-weight:600;color:var(--warn);background:var(--warn-l);border-radius:999px;padding:3px 9px;margin-top:10px;align-self:flex-start;display:inline-flex;gap:6px;align-items:center}
.syncchip.bad{color:var(--bad);background:var(--bad-l)}
.syncchip i{width:6px;height:6px;border-radius:50%;background:currentColor;display:block}
.pc.lv-out{border-left:3px solid var(--bad)}
.pc.lv-low{border-left:3px solid var(--warn)}

/* table view */
.tw{display:none;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh)}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:13.5px;min-width:900px}
thead th{position:sticky;top:0;background:#F8FAFD;color:var(--mut);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;text-align:left;padding:13px 14px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none;z-index:1}
thead th.r,tbody td.r{text-align:right}
thead th .arr{opacity:.35;margin-left:4px;font-size:10px}
thead th.on .arr{opacity:1;color:var(--blue)}
tbody td{padding:13px 14px;border-bottom:1px solid #F0F3F8;vertical-align:middle}
tbody tr{transition:background .15s}
tbody tr:hover{background:#FAFCFF}
tbody tr:last-child td{border-bottom:none}
.tn{font-weight:700;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ta{display:flex;gap:6px;justify-content:flex-end}
.ta .btn{padding:7px 11px;font-size:12.5px}

/* ---------- Sync ---------- */
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.stat-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-top:1px solid var(--line);gap:10px}
.stat-row:first-child{border-top:none;padding-top:0}
.stat-row span{color:var(--mut);font-size:13px}
.stat-row b{font-weight:700;text-align:right}
.qitem{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.qitem:first-child{border-top:none}
.qitem .qn{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qitem .qd{font-size:12px;color:var(--mut)}
.qitem .qa{display:flex;gap:6px;flex:none}
.errtxt{color:var(--bad);font-size:12px;margin-top:2px}

/* ---------- Settings ---------- */
.set-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
.set-card{padding:22px}
.set-card h3{margin:0 0 4px;font-size:15px;font-weight:700}
.set-card .sub{color:var(--mut);font-size:12.5px;margin-bottom:6px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r-sm);font-weight:600;font-size:13.5px}
.toggle input{width:40px;height:22px;appearance:none;-webkit-appearance:none;background:#D5DCE6;border-radius:99px;position:relative;cursor:pointer;transition:background .2s;flex:none}
.toggle input::after{content:'';position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.toggle input:checked{background:var(--blue)}
.toggle input:checked::after{transform:translateX(18px)}
.chkwrap{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;max-height:240px;overflow:auto;border:1px solid var(--line);border-radius:var(--r-sm);padding:12px;margin-top:8px}
.chk{display:flex;align-items:center;gap:8px;font-size:13px}
.chk input{accent-color:var(--blue)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.danger-zone{border:1px solid #F5C2C7;background:#FFF8F8}

/* ---------- Mobile bottom nav / more sheet ---------- */
.bnav{display:none}
.ov{position:fixed;inset:0;background:rgba(15,23,42,.42);opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}
.ov.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:560px;background:#fff;border-radius:24px 24px 0 0;padding:10px 20px calc(22px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.8,.2,1);z-index:21;max-height:88vh;overflow:auto;box-shadow:0 -12px 40px rgba(15,23,42,.18)}
.sheet.open{transform:none}
.grip{width:42px;height:5px;background:#D5DCE6;border-radius:9px;margin:0 auto 14px}
.sheet h3{margin:0 0 12px;font-size:16px;font-weight:700}
.mrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 4px;border-top:1px solid var(--line)}
.mrow:first-of-type{border-top:none}
.mrow button.linkish{border:none;background:none;color:var(--blue);font-weight:600}
.dlg{position:fixed;left:50%;top:50%;transform:translate(-50%,-46%) scale(.98);opacity:0;pointer-events:none;width:min(440px,calc(100vw - 32px));background:#fff;border-radius:var(--r-lg);box-shadow:0 24px 60px rgba(15,23,42,.25);padding:22px;z-index:31;transition:all .25s cubic-bezier(.2,.8,.2,1)}
.dlg.open{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
.dlg h3{margin:0;font-size:17px;font-weight:700}
.dlg .dsub{color:var(--mut);font-size:13px;margin:4px 0 14px}
.dlg .dact{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.dlg .dstat{font-size:13px;margin-top:12px;font-weight:600;min-height:18px}
.dlg .dstat.wait{color:var(--blue)}
.dlg .dstat.bad{color:var(--bad)}
.dlg .dstat.ok{color:var(--ok)}
.dlg .dstat.pend{color:var(--warn)}
.spin{width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;display:inline-block;vertical-align:-2px;margin-right:6px;animation:spin .8s linear infinite}
.x{position:absolute;right:14px;top:14px;border:none;background:#F1F5F9;width:30px;height:30px;border-radius:9px;color:var(--mut);display:grid;place-items:center}

.lock{position:fixed;inset:0;z-index:40;background:radial-gradient(1200px 600px at 10% -10%,#E3ECFB,transparent),var(--bg);display:flex;align-items:center;justify-content:center;padding:20px}
.lock.hide{display:none}
.lbox{width:100%;max-width:400px;background:#fff;border:1px solid var(--line);border-radius:24px;padding:30px 26px;box-shadow:0 24px 60px rgba(20,43,74,.12)}
.lbox .logo{margin:0 auto 14px;width:52px;height:52px;font-size:16px}
.lbox h2{margin:0;font-size:21px;font-weight:800;letter-spacing:-.02em;text-align:center}
.lbox .sub{margin:4px 0 20px;color:var(--mut);font-size:13px;text-align:center}
.roles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.roles button{border:1px solid var(--line);background:#fff;border-radius:var(--r-sm);padding:11px 6px;font-weight:600;font-size:13.5px;color:var(--mut);transition:all .15s}
.roles button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.lbox .btn{width:100%;margin-top:16px;padding:13px}
.lbox .hint{text-align:left}

.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,16px);background:var(--navy);color:#fff;padding:12px 18px;border-radius:var(--r);font-size:13.5px;font-weight:600;opacity:0;pointer-events:none;transition:all .3s;z-index:50;max-width:calc(100vw - 32px);text-align:center;box-shadow:0 12px 30px rgba(20,43,74,.3)}
.toast.show{opacity:1;transform:translate(-50%,0)}

@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shim{0%{background-position:100% 50%}100%{background-position:0 50%}}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}

/* ---------- Responsive ---------- */
@media (max-width:1100px){
  .sgrid,.set-grid{grid-template-columns:1fr}
  .dgrid{grid-template-columns:1fr}
}
@media (min-width:900px){
  .vt{display:inline-flex}
}
@media (max-width:899px){
  :root{--top:58px}
  .side{display:none}
  .main,body.side-c .main{margin-left:0}
  .mlogo{display:grid}
  .top{padding:0 14px;position:sticky}
  .top h2{font-size:16px}
  .top-r .netpill,.top-r .role{display:none}
  .top-r .lang{display:none}
  .page{padding:16px 14px calc(var(--bnav) + 28px + env(safe-area-inset-bottom,0px))}
  .ph h1{font-size:21px}
  .kpis{grid-template-columns:repeat(2,1fr);gap:10px}
  .kpi{padding:14px}
  .kpi .kv{font-size:21px}
  .grid{grid-template-columns:1fr;gap:12px}
  .pc{padding:16px}
  .search{min-width:0;flex-basis:100%}
  .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;height:calc(var(--bnav) + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);background:rgba(255,255,255,.96);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);z-index:15}
  .bnav button{border:none;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--mut);font-size:11px;font-weight:600;position:relative}
  .bnav button{flex:1 1 0;min-width:0}
  .bnav button.on{color:var(--blue)}
  .bnav button.on::before{content:'';position:absolute;top:0;width:28px;height:3px;border-radius:0 0 3px 3px;background:var(--blue)}
  .bnav .dot{position:absolute;top:10px;left:calc(50% + 8px);width:8px;height:8px;border-radius:50%;background:var(--warn);border:2px solid #fff}
  .dlg{width:calc(100vw - 24px)}
  .row2{grid-template-columns:1fr}
  .chkwrap{grid-template-columns:1fr}
}
@media (max-width:420px){
  .rates2{gap:8px}
  .rp b{font-size:17px}
  .profit .pv{font-size:15px}
}

/* details */
.detbtn{width:100%;margin-top:12px;border:1px solid var(--line);background:#F8FAFD;border-radius:var(--r-sm);padding:9px 12px;font-weight:600;font-size:13px;color:var(--navy);display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;transition:background .15s}
.detbtn:hover{background:#F1F5FA}
.detbtn svg{width:16px;height:16px;transition:transform .25s}
.detbtn.open svg{transform:rotate(180deg)}
.detbox{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;animation:up .25s both}
.detbox[hidden]{display:none !important}
.detbox div{min-width:0}
.detbox span{display:block;font-size:11px;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:.4px}
.detbox b{display:block;font-size:14px;font-weight:600;color:var(--ink);word-break:break-word;margin-top:2px}
.detx{border:1px solid var(--line);background:#fff;border-radius:8px;width:30px;height:30px;display:grid;place-items:center;color:var(--mut);cursor:pointer}
.detx svg{width:16px;height:16px;transition:transform .25s}
.detx.open svg{transform:rotate(180deg)}
tr.drow td{background:#FAFCFF;padding:14px 18px}
tr.drow .detbox{margin-top:0;padding-top:0;border-top:none;grid-template-columns:repeat(4,minmax(0,1fr))}

/* ===== Final polish ===== */
#stf{margin-top:2px;margin-bottom:14px}
#stf .pill{font-size:12.5px;padding:7px 13px}
#stf .pill[data-sf="low"].on{background:var(--warn);border-color:var(--warn)}
#stf .pill[data-sf="out"].on{background:var(--bad);border-color:var(--bad)}
.pill:focus-visible,.kpi.clickable:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
.card{transition:box-shadow .2s,border-color .2s}
.stat .v,.kpi .kv{font-variant-numeric:tabular-nums}
.pc-name{font-size:16.5px}
.pc .rp b{font-size:18px}
.stk-r .sv{font-size:13.5px}
.empty .ei{box-shadow:inset 0 0 0 1px rgba(37,99,235,.12)}
.sheet,.dlg{-webkit-tap-highlight-color:transparent}
.btn,.pill,.ibtn,.detbtn,.detx{-webkit-tap-highlight-color:transparent}
.search input::placeholder{color:#94A3B8}
.sb-txt small,.upd{letter-spacing:.1px}
@media (max-width:899px){
  .page{padding-top:14px}
  .ph h1{font-size:20px}
  .pc{border-radius:18px}
  .pc .rp b{font-size:17px}
  .detbox{grid-template-columns:1fr 1fr}
  #stf .pill{padding:6px 12px}
}
@media (max-width:360px){
  .kpis{grid-template-columns:1fr}
  .rates2{grid-template-columns:1fr}
}

/* ===== Brand mark ===== */
.logo,.mlogo{background:none !important;padding:0;color:transparent;font-size:0;overflow:hidden;border-radius:13px;box-shadow:0 4px 12px rgba(20,43,74,.18)}
.logo svg,.mlogo svg{width:100%;height:100%;display:block}
.mlogo{width:34px;height:34px;border-radius:10px}
.lbox .logo{box-shadow:0 8px 22px rgba(20,43,74,.22)}
</style>
</head>

  const delim = first.indexOf('\t') >= 0 ? '\t' : ',';
  const out = []; let row = [], field = '', inQ = false;
  for (let i = 0; i < text.length; i++){
    const ch = text[i];
    if (inQ){ if (ch === '"'){ if (text[i + 1] === '"'){ field += '"'; i++; } else inQ = false; } else field += ch; }
    else {
      if (ch === '"') inQ = true;
      else if (ch === delim){ row.push(field); field = ''; }
      else if (ch === '\n'){ row.push(field); out.push(row); row = []; field = ''; }
      else if (ch !== '\r') field += ch;
    }
  }
  if (field !== '' || row.length){ row.push(field); out.push(row); }
  return out.filter(r => r.some(x => x.trim() !== ''));
}
function parseTable(text){
  const grid = parseCSV(String(text).replace(/^\uFEFF/, ''));
  if (grid.length < 2) return null;
  const headers = grid[0].map((h, i) => h.trim() || ('Column ' + (i + 1)));
  const rows = grid.slice(1).map(r => headers.map((_, i) => (r[i] || '').trim()));
  return {headers: headers, rows: rows};
}
function titleIdx(h){ const i = h.findIndex(x => /item\s*name|product\s*name|নাম/i.test(x)); return i < 0 ? 0 : i; }
function priceIdx(h){
  let i = h.findIndex(x => /purchase|ক্রয়/i.test(x) && /rate|রেট|দাম|মূল্য|price/i.test(x));
  if (i < 0) i = h.findIndex(x => /রেট|rate|price|দাম|মূল্য/i.test(x));
  return i;
}
function salesRateIdx(h){ return h.findIndex(x => /sales?\s*rate|বিক্রয়\s*(রেট|মূল্য|দাম)/i.test(x)); }
function ensureCfg(c){
  const key = c.headers.join('|') + '|v7';
  if (!c.cfg || c.cfg.key !== key){
    const show = c.headers.map((_, i) => i).filter(i => !/total\s*value/i.test(c.headers[i]));
    c.cfg = {key: key, show: show, title: titleIdx(c.headers), price: priceIdx(c.headers)};
  }
}
function mkCat(headers, rows, url, tab){
  const c = {headers: headers, rows: rows, url: url || '', tab: tab || '', time: Date.now(), cfg: null};
  ensureCfg(c); return c;
}
function carryOver(nc, old){
  if (old){ if (old.cfg && old.cfg.key === nc.cfg.key) nc.cfg = old.cfg; nc.tab = old.tab || nc.tab; }
  return nc;
}

/* ---------- Local row updates ---------- */
function findRow(c, code){
  const ci = colIdx(c, 'Item Code');
  if (ci < 0) return null;
  return c.rows.find(r => String(r[ci]).trim() === String(code).trim()) || null;
}
function applySaleLocal(c, code, qty){
  const si = colIdx(c, 'Sales Quantity'), ri = colIdx(c, 'Received Quantity'), ki = colIdx(c, 'Stock in Hand');
  const row = findRow(c, code);
  if (!row || si < 0 || ri < 0 || ki < 0) return;
  const sales = (num(row[si]) || 0) + qty;
  row[si] = String(sales);
  row[ki] = String((num(row[ri]) || 0) - sales);
}
function setLocal(c, code, field, value){
  let idx = colIdx(c, field);
  if (idx < 0){
    c.headers.push(field); c.rows.forEach(r => r.push('')); idx = c.headers.length - 1;
    c.cfg.key = c.headers.join('|') + '|v7';
    if (c.cfg.show) c.cfg.show.push(idx);
  }
  const row = findRow(c, code);
  if (row) row[idx] = String(value);
}
function rateFields(c){
  const sr = salesRateIdx(c.headers), pr = c.cfg.price;
  return {p: {name: pr >= 0 ? c.headers[pr] : 'Purchase Rate', idx: pr}, s: {name: sr >= 0 ? c.headers[sr] : 'Sales Rate', idx: sr}};
}
function wantRemark(stock, current){
  if (stock === null) return null;
  if (stock <= 0) return 'Order the Item';
  if (/^order the item$/i.test(String(current || '').trim())) return 'No need to ORDER';
  return null;
}
function fixRemarkRow(name, r){
  const c = S.cats[name]; if (!c) return;
  const si = colIdx(c, 'Stock in Hand'), mi = colIdx(c, 'Remarks'), ci = colIdx(c, 'Item Code');
  if (si < 0 || mi < 0 || ci < 0) return;
  const want = wantRemark(num(r[si]), r[mi]);
  if (!want || r[mi] === want) return;
  const code = r[ci], field = c.headers[mi];
  const pend = S.queue.find(q => !q.sent && q.cat === name && q.code === code && q.field === field);
  if (pend){ pend.value = want; pend.failed = false; }
  else S.queue.push({id: uid(), type: 'rate', cat: name, code: code, field: field, value: want, sent: false, failed: false, attempts: 0});
  r[mi] = want;
}
function sweepRemarks(name){ const c = S.cats[name]; if (c) c.rows.forEach(r => fixRemarkRow(name, r)); }

/* ---------- Derived product facts ---------- */
function facts(c, r){
  const rf = rateFields(c);
  const si = colIdx(c, 'Stock in Hand'), ri = colIdx(c, 'Received Quantity'), ci = colIdx(c, 'Item Code'), mi = colIdx(c, 'Remarks');
  const stock = si >= 0 ? num(r[si]) : null;
  const recv = ri >= 0 ? num(r[ri]) : null;
  const buy = rf.p.idx >= 0 ? num(r[rf.p.idx]) : null;
  const sell = rf.s.idx >= 0 ? num(r[rf.s.idx]) : null;
  let level = 'na';
  if (stock !== null){ level = stock <= 0 ? 'out' : (recv && stock / recv <= 0.2 ? 'low' : 'ok'); }
  let profit = null, pct = null;
  if (buy !== null && sell !== null && sell > 0){ profit = sell - buy; pct = buy > 0 ? profit / buy * 100 : null; }
  const catIdx = c.headers.findIndex(h => /^(category|ক্যাটাগরি|type)$/i.test(h.trim()));
  const category = catIdx >= 0 && r[catIdx] ? r[catIdx] : S.active;
  return {rf: rf, stock: stock, recv: recv, buy: buy, sell: sell, level: level, profit: profit, pct: pct,
    code: ci >= 0 ? r[ci] : '', name: r[c.cfg.title] || '', category: category, mi: mi, ci: ci};
}
function pendingFor(cat, code){
  return S.queue.filter(q => !q.sent && q.cat === cat && q.code === String(code));
}

/* ---------- Sync ---------- */
function setNetPill(){
  const pill = $('netPill');
  const pend = pendingOps().length, fail = failedOps().length;
  let cls = '', txt = '';
  if (!navigator.onLine){ cls = 'off'; txt = t('offline'); }
  else if (fail){ cls = 'bad'; txt = t('failedW') + ' ' + fmt(fail); }
  else if (pend){ cls = 'warn'; txt = t('pendingW') + ' ' + fmt(pend); }
  else { txt = t('online'); }
  pill.className = 'netpill ' + cls;
  $('netTxt').textContent = txt;
}
function sheetFetchUrl(raw, tab){
  const value = String(raw || '').trim();
  if (!value) return '';
  // Accept a normal Google Sheets workbook URL and fetch only the named tab.
  const match = value.match(/\/spreadsheets\/d\/([^/?#]+)/);
  if (match && !/\/(pub|gviz)\b/i.test(value)){
    const sheet = String(tab || '').trim();
    if (!sheet) throw new Error('শীটের ট্যাব নাম লিখুন (যেমন Sanitary)');
    return 'https://docs.google.com/spreadsheets/d/' + match[1] +
      '/gviz/tq?tqx=out:csv&sheet=' + encodeURIComponent(sheet);
  }
  // Published CSV or an already prepared gviz URL is used as supplied.
  return value;
}
async function refreshCat(name){
  const c = S.cats[name];
  if (!c || !c.url) return 'nourl';
  if (!navigator.onLine) return 'offline';
  try {
    const sourceUrl = sheetFetchUrl(c.url, c.tab);
    const sep = sourceUrl.indexOf('?') >= 0 ? '&' : '?';
    const res = await fetch(sourceUrl + sep + 't=' + Date.now(), {cache: 'no-store'});
    if (!res.ok) throw new Error('http ' + res.status);
    const tb = parseTable(await res.text());
    if (!tb) return 'bad';
    const nc = mkCat(tb.headers, tb.rows, c.url, c.tab);
    S.queue.filter(q => !q.sent && q.cat === name).forEach(q =>
      q.type === 'rate' ? setLocal(nc, q.code, q.field, q.value) : applySaleLocal(nc, q.code, q.qty));
    S.cats[name] = carryOver(nc, c);
    sweepRemarks(name);
    save();
    return 'ok';
  } catch(e){ return 'fail'; }
}
async function refreshNames(names, silent){
  const list = names.filter(n => S.cats[n] && S.cats[n].url);
  if (!list.length){ if (!silent && names.length) toast(t('noLink')); return false; }
  if (!navigator.onLine){ if (!silent) toast(t('offlineMsg')); return false; }
  loading = true; renderAll();
  let failed = 0;
  for (const n of list){ if ((await refreshCat(n)) !== 'ok') failed++; }
  loading = false;
  if (failed === 0){ S.last = new Date().toISOString(); }
  save(); renderAll();
  if (!silent) toast(failed ? t('updFailed') : t('updated'));
  return failed === 0;
}

/* Sends queued operations. Only items the sheet confirms are cleared.
   Failed items stay visible until retried or explicitly discarded. */
async function syncSales(){
  if (syncing) return;
  const due = pendingOps();
  if (!due.length){ renderAll(); return; }
  if (!S.salesUrl || !navigator.onLine){ renderAll(); return; }
  syncing = true; renderAll();
  const cats = [...new Set(due.map(q => q.cat))];
  for (const cat of cats){
    const items = due.filter(q => q.cat === cat);
    const c = S.cats[cat];
    const payload = {
      sheet: (c && c.tab) || cat,
      items: items.map(q => q.type === 'rate'
        ? {id: q.id, type: 'rate', code: q.code, field: q.field, value: q.value}
        : {id: q.id, type: 'sale', code: q.code, qty: q.qty})
    };
    items.forEach(q => { q.attempts = (q.attempts || 0) + 1; });
    try {
      const res = await fetch(S.salesUrl, {method: 'POST', headers: {'Content-Type': 'text/plain;charset=utf-8'}, body: JSON.stringify(payload)});
      const json = await res.json();
      if (!json.ok) throw new Error(json.error || 'server error');
      const map = {};
      (json.results || []).forEach(r => { map[r.id] = r; });
      items.forEach(q => {
        const r = map[q.id];
        if (!r){ q.err = 'no-response'; return; }
        if (r.status === 'done' || r.status === 'skipped'){ q.sent = true; q.err = ''; }
        else { q.failed = true; q.err = r.status === 'notfound' ? 'Item code not found in sheet' : (r.error || 'write error'); }
      });
    } catch(e){
      items.forEach(q => { q.err = navigator.onLine ? 'Could not reach Apps Script (' + e.message + ')' : 'offline'; });
    }
    S.queue = S.queue.filter(q => !q.sent);
    save();
  }
  syncing = false; save(); renderAll();
}
function retryOp(id){
  const q = S.queue.find(x => x.id === id);
  if (!q) return;
  q.failed = false; save(); toast(t('retried')); syncSales();
}
function discardOp(id){
  if (!confirm(t('discardQ'))) return;
  S.queue = S.queue.filter(x => x.id !== id);
  save(); renderAll(); toast(t('discarded'));
}

function seqOf(c, r){
  const ni = colIdx(c, 'Item No.');
  const n = ni >= 0 ? num(r[ni]) : null;
  return n !== null ? n : c.rows.indexOf(r) + 1;
}
function sortRows(list){
  const c = S.cats[S.active];
  const key = sortKey;
  if (key === 'seq') return list.slice().sort((a, b) => (seqOf(c, a) - seqOf(c, b)) * sortDir);
  const val = r => {
    const f = facts(c, r);
    if (key === 'name') return (f.name || '').toLowerCase();
    if (key === 'cat') return f.category.toLowerCase();
    if (key === 'stock') return f.stock === null ? -Infinity : f.stock;
    if (key === 'buy') return f.buy === null ? -Infinity : f.buy;
    if (key === 'sell') return f.sell === null ? -Infinity : f.sell;
    if (key === 'profit') return f.profit === null ? -Infinity : f.profit;
    return '';
  };
  return list.map(r => [val(r), r]).sort((a, b) => a[0] < b[0] ? -sortDir : a[0] > b[0] ? sortDir : 0).map(x => x[1]);
}

/* Sale: queue, then wait for the sheet to confirm before saying "saved". */
async function submitSale(){
  const cur = curRow();
  if (!cur){ closeDlg(); return; }
  const qty = parseInt($('dQty').value, 10);
  if (!qty || qty <= 0){ setDStat('bad', t('qtyBad')); return; }
  const f = facts(cur.c, cur.r);
  if (f.stock !== null && qty > f.stock && !confirm(t('confirmStock') + ': ' + fmt(f.stock) + '. ' + fmt(qty) + ' ' + t('confirmQ'))) return;
  const op = {id: uid(), type: 'sale', cat: S.active, code: CUR.code, qty: qty, sent: false, failed: false, attempts: 0};
  S.queue.push(op);
  applySaleLocal(cur.c, CUR.code, qty);
  fixRemarkRow(S.active, cur.r);
  save();
  const go = $('dGo'); if (go) go.disabled = true;
  setDStat('wait', t('savingSheet'));
  renderAll();
  await syncSales();
  const still = S.queue.find(q => q.id === op.id);
  if (!still){ toast(t('saleSaved')); closeDlg(); }
  else if (still.failed){ setDStat('bad', t('saleFailed')); if (go) go.disabled = false; }
  else { setDStat('pend', t('salePending')); if (go) go.disabled = false; }
  renderAll();
}

/* Rates: only changed, non-empty fields are sent. Other rate is never touched. */
async function submitRates(){
  const cur = curRow();
  if (!cur){ closeDlg(); return; }
  const rf = rateFields(cur.c);
  const pairs = [];
  const buyEl = $('dBuy');
  if (buyEl) pairs.push([buyEl.value.trim(), rf.p]);
  pairs.push([$('dSell').value.trim(), rf.s]);
  const changes = [];
  let bad = false;
  pairs.forEach(p => {
    const v = p[0];
    if (v === '') return;
    if (isNaN(Number(v))){ bad = true; return; }
    const cv = p[1].idx >= 0 ? String(cur.r[p[1].idx] || '').trim() : '';
    if (v !== cv) changes.push({field: p[1].name, value: v});
  });
  if (bad){ setDStat('bad', t('onlyNum')); return; }
  if (!changes.length){ setDStat('bad', t('noChange')); return; }
  const ops = changes.map(ch => ({id: uid(), type: 'rate', cat: S.active, code: CUR.code, field: ch.field, value: ch.value, sent: false, failed: false, attempts: 0}));
  ops.forEach(op => { S.queue.push(op); setLocal(cur.c, CUR.code, op.field, op.value); });
  save();
  const go = $('dGo'); if (go) go.disabled = true;
  setDStat('wait', t('savingSheet'));
  renderAll();
  await syncSales();
  const left = ops.map(o => S.queue.find(q => q.id === o.id)).filter(Boolean);
  if (!left.length){ toast(t('savedSheet')); closeDlg(); }
  else if (left.some(q => q.failed)){ setDStat('bad', t('failedSheet')); if (go) go.disabled = false; }
  else { setDStat('pend', t('pendingSheet')); if (go) go.disabled = false; }
  renderAll();
}

/* ---------- Events ---------- */
document.addEventListener('click', e => {
  const gs = e.target.closest('[data-go-stock]');
  if (gs){ stockF = gs.dataset.goStock; $('q').value = ''; page = 'inventory'; renderAll(); window.scrollTo(0, 0); return; }
  const sf = e.target.closest('[data-sf]');
  if (sf){ stockF = sf.dataset.sf; renderInventory(); return; }
  const pg = e.target.closest('[data-page]');
  if (pg && !pg.hasAttribute('data-admin-skip')){
    if (pg.dataset.page === 'settings' && !can('settings')) { toast(t('noPerm')); return; }
    page = pg.dataset.page; renderAll(); window.scrollTo(0, 0); return;
  }
  const pgo = e.target.closest('[data-page-go]');
  if (pgo){ page = pgo.dataset.pageGo; renderAll(); return; }
  const d = e.target.closest('[data-d]');
  if (d){
    if (d.dataset.d === 'cancel'){ closeDlg(); return; }
    if (d.dataset.d === 'sell') submitSale();
    if (d.dataset.d === 'rate') submitRates();
    return;
  }
  const a = e.target.closest('[data-a]');
  if (a){
    const act = a.dataset.a, code = a.dataset.code;
    if (act === 'det'){
      const card = a.closest('.pc');
      if (card){ const box = card.querySelector('.detbox'); box.hidden = !box.hidden; a.classList.toggle('open', !box.hidden); }
      else { const row = a.closest('tr').nextElementSibling; row.hidden = !row.hidden; a.classList.toggle('open', !row.hidden); }
      return;
    }
    if (act === 'sell') openSell(code);
    else if (act === 'rate') openRate(code);
    else if (act === 'retry') retryOp(a.dataset.id);
    else if (act === 'discard') discardOp(a.dataset.id);
    else if (act === 'syncNow'){ if (can('sell')) syncSales(); }
    else if (act === 'refreshNow') refreshActive();
    else if (act === 'setup') { page = 'settings'; renderAll(); }
    return;
  }
  const c = e.target.closest('[data-c]');
  if (c){ S.active = c.dataset.c; $('q').value = ''; save(); renderAll(); return; }
  const v = e.target.closest('[data-view]');
  if (v){ view = v.dataset.view; renderInventory(); return; }
  const s = e.target.closest('[data-sort]');
  if (s){
    const k = s.dataset.sort;
    if (sortKey === k) sortDir = -sortDir; else { sortKey = k; sortDir = (k === 'name' || k === 'cat') ? 1 : -1; }
    renderInventory(); return;
  }
});

  $('connRes').textContent = '…';
  try {
    const sourceUrl = sheetFetchUrl(u, $('tab').value.trim() || (c && c.tab) || S.active);
    const res = await fetch(sourceUrl + (sourceUrl.indexOf('?') >= 0 ? '&' : '?') + 't=' + Date.now(), {cache: 'no-store'});
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const tb = parseTable(await res.text());
    if (!tb) throw new Error('no data');
    $('connRes').innerHTML = '<span style="color:var(--ok);font-weight:600">✓ ' + esc(t('testOk')) + ': ' + fmt(tb.rows.length) + ' rows, ' + fmt(tb.headers.length) + ' columns</span>';
  } catch(e){
    $('connRes').innerHTML = '<span style="color:var(--bad);font-weight:600">✕ ' + esc(t('testBad')) + ' (' + esc(e.message) + ')</span>';
  }
};
$('saveUrl').onclick = () => {
  const c = S.cats[S.active];
  if (!c){ toast(t('nameNeed')); return; }
  const u = $('url').value.trim();
  if (u && u.indexOf('http') !== 0){ toast('URL?'); return; }
  c.url = u; c.tab = $('tab').value.trim() || S.active;
  save(); refreshNames([S.active], false);
};
$('autoSel').onchange = () => { S.auto = +$('autoSel').value; S.lastAuto = Date.now(); save(); toast(S.auto ? 'Auto: ' + S.auto + ' min' : t('autoOff')); };
$('saveSalesUrl').onclick = () => {
  const u = $('salesUrl').value.trim();
  if (u && u.indexOf('http') !== 0){ toast('URL?'); return; }
  S.salesUrl = u; save(); toast(t('savedUrl')); syncSales();
};
$('staffPur').onchange = () => { S.staffPurchase = $('staffPur').checked; save(); renderAll(); toast(t('savedAccess')); };
$('saveAccess').onclick = () => {
  const a = $('pinAdmin').value.trim(), p = $('pinPartner').value.trim(), s = $('pinStaff').value.trim();
  if ((a && a.length < 4) || (p && p.length < 4) || (s && s.length < 4)){ toast(t('pinShort')); return; }
  if (a) S.pins.admin = hash(a);
  if (p) S.pins.partner = hash(p);
  if (s) S.pins.staff = hash(s);
  $('pinAdmin').value = ''; $('pinPartner').value = ''; $('pinStaff').value = '';
  save(); renderAll(); toast(t('savedAccess'));
};
$('file').onchange = e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  const name = $('catName').value.trim();
  if (!name){ toast(t('nameNeed')); return; }
  const reader = new FileReader();
  reader.onload = () => setCat(name, reader.result);
  reader.readAsText(f, 'UTF-8');
};
$('loadPaste').onclick = () => {
  const name = $('catName').value.trim(), text = $('paste').value;
  if (!name){ toast(t('nameNeed')); return; }
  if (text.trim()) setCat(name, text);
};
function setCat(name, text){
  name = String(name || '').trim();
  if (!name){ toast(t('nameNeed')); return false; }
  const tb = parseTable(text);
  if (!tb){ toast(t('badFormat')); return false; }
  const old = S.cats[name];
  S.cats[name] = carryOver(mkCat(tb.headers, tb.rows, old ? old.url : '', old ? old.tab : name), old);
  sweepRemarks(name);
  S.active = name; save(); renderAll(); toast(t('loaded'));
  return true;
}
document.addEventListener('change', e => {
  if (e.target && e.target.id === 'autoSel') return;
});
document.addEventListener('click', e => {
  if (e.target.id === 'saveCols'){
    const c = S.cats[S.active]; if (!c) return;
    const box = $('cols');
    c.cfg.title = +$('titleSel').value;
    c.cfg.price = +$('priceSel').value;
    const checked = [...box.querySelectorAll('input[type=checkbox]')].filter(x => x.checked).map(x => +x.value);
    c.cfg.show = checked.length === c.headers.length ? null : checked;
    save(); renderAll(); toast(t('colsSaved'));
  }
  if (e.target.id === 'delCat'){
    const c = S.cats[S.active]; if (!c) return;
    if (!confirm('"' + S.active + '": ' + t('confirmDel'))) return;
    delete S.cats[S.active];
    S.active = Object.keys(S.cats)[0] || '';
    S.queue = S.queue.filter(q => q.cat !== S.active);
    save(); renderAll(); toast(t('deleted'));
  }
});

/* Lock / login */
function showLock(){
  const hasAdmin = !!S.pins.admin;
  $('lock').classList.remove('hide');
  $('loginPane').hidden = !hasAdmin;
  $('setupPane').hidden = hasAdmin;
  paintRoles();
}
function paintRoles(){
  document.querySelectorAll('#roles button').forEach(b => {
    const r = b.dataset.role;
    b.textContent = t('role' + r.charAt(0).toUpperCase() + r.slice(1));
    b.classList.toggle('on', r === selRole);
  });
}
function unlock(){ $('lock').classList.add('hide'); $('pin').value = ''; renderAll(); }
function login(r, pin){
  if (!S.pins[r]){ toast(t('roleNotSet')); return; }
  if (S.pins[r] !== hash(pin)){ toast(t('wrongPin')); return; }
  S.session = r; page = r === 'staff' ? 'inventory' : 'dashboard'; save(); unlock(); toast(t('welcome'));
}
function setupDone(){
  const a = $('setA').value.trim(), b = $('setB').value.trim();
  if (a.length < 4){ toast(t('pinShort')); return; }
  if (a !== b){ toast(t('pinMismatch')); return; }
  const p = $('setP').value.trim(), s = $('setS').value.trim();
  if ((p && p.length < 4) || (s && s.length < 4)){ toast(t('pinShort')); return; }
  S.pins.admin = hash(a);
  if (p) S.pins.partner = hash(p);
  if (s) S.pins.staff = hash(s);
  S.session = 'admin'; page = 'dashboard'; save(); unlock(); toast(t('welcome'));
}
function logout(){
  S.session = ''; save(); closeDlg(); closeMore(); showLock(); toast(t('logoutDone'));
}
$('roles').addEventListener('click', e => {
  const b = e.target.closest('[data-role]'); if (!b) return;
  selRole = b.dataset.role; paintRoles();
});
$('loginBtn').onclick = () => login(selRole, $('pin').value.trim());
$('pin').addEventListener('keydown', e => { if (e.key === 'Enter') login(selRole, $('pin').value.trim()); });
$('setupBtn').onclick = setupDone;
$('logoutBtn') && $('logoutBtn').addEventListener('click', logout);

MQ.addEventListener && MQ.addEventListener('change', () => renderAll());
window.addEventListener('online', () => { setNetPill(); refreshNames(Object.keys(S.cats), true); syncSales(); });
window.addEventListener('offline', () => { setNetPill(); renderAll(); });
window.addEventListener('error', e => { toast('Error: ' + (e.message || 'unknown')); });

function applyLang(){
  document.documentElement.lang = S.lang;
  document.querySelectorAll('[data-t]').forEach(el => { el.innerHTML = t(el.dataset.t); });
  document.querySelectorAll('[data-page]').forEach(b => { const sp = b.querySelector('.ic'); if (sp && !sp.innerHTML){ sp.innerHTML = ic(b.dataset.page === 'dashboard' ? 'dash' : b.dataset.page === 'inventory' ? 'box' : b.dataset.page === 'sync' ? 'sync' : 'cog'); } });
  const bn = document.querySelector('#bnav #moreBtn .ic'); if (bn && !bn.innerHTML) bn.innerHTML = ic('more');
  const vg = document.querySelector('#viewTog [data-view="grid"] .vgi'); if (vg && !vg.innerHTML) vg.innerHTML = ic('grid');
  const vt = document.querySelector('#viewTog [data-view="table"] .vti'); if (vt && !vt.innerHTML) vt.innerHTML = ic('table');
  const rb = $('refreshBtn'); if (!rb.innerHTML) rb.innerHTML = ic('refresh');
  const sb = document.querySelector('.search .si'); if (sb && !sb.innerHTML) sb.innerHTML = ic('search');
  $('q').placeholder = t('search');
  $('autoSel').querySelector('option[value="0"]').textContent = t('autoOff');
  document.querySelectorAll('[data-t="open"]').forEach(el => el.textContent = t('open'));
  paintRoles();
  renderBase();
  document.body.classList.toggle('side-c', !!S.side);
  renderAll();
}

(function init(){
  if (!S.seeded){
    if (SEED.rows.length && !S.cats.Sanitary) S.cats.Sanitary = mkCat(SEED.headers, SEED.rows, '', 'Inventory');
    S.seeded = true;
  }
  Object.values(S.cats).forEach(ensureCfg);
  Object.keys(S.cats).forEach(sweepRemarks);
  if (!S.cats[S.active]) S.active = Object.keys(S.cats)[0] || '';
  save();
  applyLang();
  if (!S.pins.admin || !role()){ showLock(); }
  else {
    unlock();
    if (navigator.onLine && Object.keys(S.cats).length){ refreshNames(Object.keys(S.cats), true); syncSales(); }
  }
  setInterval(() => {
    if (!role() || !S.auto || document.hidden || !navigator.onLine) return;
    if (Date.now() - (S.lastAuto || 0) < S.auto * 60000) return;
    S.lastAuto = Date.now(); save();
    refreshNames(Object.keys(S.cats), true);
    syncSales();
  }, 30000);
})();
</script>
</body>
</html>
